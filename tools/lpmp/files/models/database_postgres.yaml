########################################################################
# Database — PostgreSQL errors, connection failures, deadlocks
########################################################################

description: "PostgreSQL database events — FATAL/ERROR level messages, connection refused, deadlocks, timeouts, checkpoint failures, and recovery events."

blocks:
  - label: "Database Errors"
    file: ["postgres.log*"]
    timeline:
      - 'FATAL'
      - 'ERROR'
      - 'deadlock'
      - 'timeout'
      - 'connection refused'
      - 'too many connections'
      - 'checkpoint'
      - 'recovery'
      - 'database system'
      - 'shutting down'
      - 'database system is ready'
