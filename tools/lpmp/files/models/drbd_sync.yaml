########################################################################
# DRBD — primary/secondary transitions, sync state, split-brain
########################################################################

description: "DRBD replication events — primary/secondary role changes, sync source/target, split-brain detection, resync progress, and connection state."

blocks:
  - label: "DRBD State"
    file: ["daemon.log*", "kern.log*"]
    timeline:
      - 'drbd'
      - 'Primary'
      - 'Secondary'
      - 'SyncSource'
      - 'SyncTarget'
      - 'StandAlone'
      - 'Connected'
      - 'Inconsistent'
      - 'split-brain'
      - 'resync'
      - 'WFConnection'
      - 'Diskless'
