########################################################################
# Ceph Health — cluster health transitions, PG degradation, recovery
########################################################################

description: "Ceph cluster health — HEALTH_OK/WARN/ERR transitions, PG state changes (degraded/undersized/stale), recovery and backfill progress, storage alarms, and mon quorum changes."

blocks:
  - label: "Ceph Health"
    file: ["ceph-manager.log*"]
    timeline:
      - 'HEALTH_OK'
      - 'HEALTH_WARN'
      - 'HEALTH_ERR'
      - 'objects degraded'
      - 'pgs degraded'
      - 'pgs undersized'
      - 'stale'
      - 'Ceph status changed'
      - 'Ceph health'
      - 'storage alarm'
      - 'near full'
      - 'full ratio'
      - 'mons down'
      - 'quorum'
      - 'recovery'
      - 'backfill'
