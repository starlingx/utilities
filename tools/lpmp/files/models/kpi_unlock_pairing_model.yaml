########################################################################
#
# Model:   KPI Unlock Model
# Purpose: Profile host unlock timing using pair blocks to measure
#          duration of lock, shutdown, pod drain, reboot blackout,
#          OS startup, platform startup, and K8s startup phases.
#
########################################################################
#
# Variable Substitution:
#   {hostname}  - replaced by --hostname value (default: controller-0)
#
# Block Fields (pattern blocks):
#   label          - (required) block identifier
#   file           - (required) log file glob pattern(s)
#   patterns       - list of sequential patterns to match
#   max_time_delta - max seconds between patterns (default: settings value)
#
# Block Fields (pair blocks):
#   label          - (required) block identifier
#   file           - (required) log file glob pattern(s)
#   start          - start pattern for duration measurement
#   stop           - stop pattern for duration measurement
#   optional       - skip with warning if not found (default: false)
#   max_time_delta - max seconds between patterns (default: settings value)
#
# Pattern Syntax:
#   - "string"                  - literal match
#   - ["a", "b"]               - OR match (first found wins)
#
########################################################################

description: "Key performance indicators for host unlock — start/stop durations for the notable unlock milestones."

settings:
    max_time_delta: 600
    block_time_tolerance: 10
    script: ["pod_ready_times_describe.py", "var/extra/containerization_pods.info"]

blocks:
  - label: "SHUTDOWN PHASE"
    file: ["mtcAgent.log*", "auth.log*"]
    start: 'Info : {hostname} Unlock Action'
    stop: 'notice System is rebooting'

  - label: "POD DRAIN"
    file: ["mtcAgent.log*"]
    start: '{hostname} force pod drain script launched'
    stop: 'pods drained'

  - label: "test-service-no-pvc outage"
    file: ["mtcAgent.log*","availability-test-service.log*"]
    start: '{hostname} force pod drain script launched'
    stop: 'availability-test-service: Starting periodic write task'
    optional: true
    max_time_delta: 900

  - label: "test-service-with-pvc outage"
    file: ["mtcAgent.log*","availability-test-service-with-pvc.log*"]
    start: '{hostname} force pod drain script launched'
    stop: 'availability-test-service-with-pvc: Starting periodic write task'
    optional: true
    max_time_delta: 900

  - label: "LAZY REBOOT"
    file: ["mtcClient.log*"]
    start: 'lazy reboot command received'
    stop: 'failsafe reboot script launched'
    optional: true

  - label: "BLACKOUT PHASE"
    file: ["auth.log*", "kern.log*"]
    start: 'notice System is rebooting'
    stop: 'Kernel command line:'

  - label: "OS: NETWORK CONFIG PHASE"
    file: ["kern.log*", "daemon.log*"]
    start: 'Kernel command line:'
    stop: 'Reached target .*Network is Online'
    optional: true

  - label: "OS: PLATFORM SVC CONFIG PHASE "
    file: ["kern.log*", "daemon.log*"]
    start: 'Kernel command line:'
    stop: 'Reached target .*Multi-User System'

  - label: "Kubelet startup"
    file: ["daemon.log*"]
    patterns:
      - 'info Starting .*Kubernetes Kubelet Server'

  - label: "PLATFORM READY PHASE"
    file: ["daemon.log*", "mtcAgent.log*"]
    start: 'Reached target .*Multi-User System'
    stop: 'Info : controller-0 unlocked-enabled-available'

  - label: "CSI Ready"
    file: ["daemon.log*"]
    start: 'Started .*Kubernetes Kubelet Server'
    stop: 'kubernetes.io/csi: Register new plugin with name'

  - label: "test-service-no-pvc ready"
    file: ["daemon.log*","availability-test-service.log*"]
    start: 'Started .*Kubernetes Kubelet Server'
    stop: 'availability-test-service: Starting periodic write task'
    optional: true

  - label: "test-service-with-pvc ready"
    file: ["daemon.log*", "availability-test-service-with-pvc.log*"]
    start: 'Started .*Kubernetes Kubelet Server'
    stop: 'availability-test-service-with-pvc: Starting periodic write task'
    optional: true

  - label: "K8s STARTUP PHASE"
    file: ["daemon.log*"]
    start: 'Started .*Kubernetes Kubelet Server'
    stop: ['info k8s-pod-recovery.service: .*successfully', 'info k8s-pod-recovery.service: Succeeded.']
    optional: true